server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Text assets compress ~70% (the JS bundle is the bulk of every first
    # load). Caddy in front doesn't compress unless told to, so do it here.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # This is a client-side-routed SPA — a direct request to e.g. /drop/<id>
    # has no matching file on disk. Without this fallback, nginx would 404
    # on every route except "/", breaking shared drop links and page refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cached: index.html points at hashed assets, and the service
    # worker files + manifest have fixed names — caching them would pin
    # clients to an old deploy.
    location ~ ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    # Only Vite's content-hashed output is safe to cache forever.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Icons and other public/ files keep fixed names; cache them, but not
    # permanently, so a replaced icon still reaches clients.
    location ~* \.(png|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
    }
}
