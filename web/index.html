<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0707" />
    <title>Dead Drop</title>
    <meta
      name="description"
      content="Leave something at a location for someone else to find. No account required. Open source, self-hostable, privacy-first."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Replace your-domain.example with the real deployment domain before
         launch — OG/Twitter previews generally need an absolute image URL
         to render correctly, a relative path isn't reliably resolved by
         link-preview scrapers across platforms. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dead Drop" />
    <meta
      property="og:description"
      content="Leave something at a location for someone else to find. No account required. Open source, self-hostable, privacy-first."
    />
    <meta property="og:image" content="https://your-domain.example/og-image.png" />
    <meta property="og:url" content="https://your-domain.example" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dead Drop" />
    <meta
      name="twitter:description"
      content="Leave something at a location for someone else to find. No account required."
    />
    <meta name="twitter:image" content="https://your-domain.example/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
